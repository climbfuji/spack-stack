packages:
  all:
    require:
    - any_of: ['%gcc@=13.3.1']
      when: '%gcc'
  mpi:
    buildable: false
    require:
    - cray-mpich@8.1.32
  gcc:
    buildable: false
    externals:
    - spec: gcc@13.3.1 languages:='c,c++,fortran'
      prefix: /usr
      modules:
      - ncarenv/25.10
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-13
          cxx: /usr/bin/g++-13
          fortran: /usr/bin/gfortran-13
        environment:
          set:
            # https://github.com/JCSDA/spack-stack/issues/957
            FI_CXI_RX_MATCH_MODE: hybrid
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@8.1.32 +wrappers
      prefix: /opt/cray/pe/mpich/8.1.32/ofi/gnu/12.3
      modules:
      - cray-mpich/8.1.32
      - libfabric/1.22.0
